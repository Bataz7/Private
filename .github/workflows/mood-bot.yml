name: mood-bot

on:
  push:
    paths: ["mood/**", ".github/workflows/mood-bot.yml"]
  pull_request:
    paths: ["mood/**", ".github/workflows/mood-bot.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: mood
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: mood/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run size
