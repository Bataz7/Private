services:
  mood-bot:
    build:
      context: .
      args:
        # فاضي = SQLite. للقواعد الثانية: pg أو mysql2 أو mongodb
        DB_DRIVER: ""
    container_name: mood-bot
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
