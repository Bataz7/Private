{% from "views/_macros.html" import header with context %}
<div id="view" data-kind="rate" data-stars="{{ rating.mine.stars if rating.mine else 0 }}">
  {{ header('star', t('rate.title'), t('rate.sub')) }}
  <div class="card block" style="text-align:center">
    <div class="avg">{% if rating.count %}{{ t('rate.avg', avg='<b>' ~ rating.avg ~ '</b>', count=rating.count)|safe }}{% else %}{{ t('rate.first') }}{% endif %}</div>
    <div class="stars" id="stars">{% for n in range(1, 6) %}<button type="button" data-n="{{ n }}" aria-label="{{ n }}">{{ icon('star') }}</button>{% endfor %}</div>
    <div class="f" style="text-align:start"><label>{{ t('rate.comment') }}</label><textarea id="rc" rows="4" maxlength="500" placeholder="{{ t('rate.ph') }}">{{ rating.mine.comment if rating.mine else '' }}</textarea></div></div>
  <div class="savebar"><button class="btn" id="sv" type="button">{{ icon('send') }}<span>{{ t('rate.update') if rating.mine else t('rate.submit') }}</span></button></div>
</div>
