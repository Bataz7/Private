{% from "views/_macros.html" import header with context %}
<div id="view" data-kind="themes">
  {{ header('palette', t('theme.title'), t('theme.sub')) }}
  <h2 class="sect-title">{{ icon('sparkles') }}{{ t('theme.pick') }}</h2>
  <div class="theme-grid">{% for id in THEMES.ORDER %}
    <button type="button" class="theme-card" data-theme="{{ id }}" data-id="{{ id }}" data-tilt="8" style="--i:{{ loop.index0 }}">
      <div class="tc-prev"><div class="s"></div><div class="m"><div class="h"></div><div class="c"><i></i><i></i><i></i></div></div></div>
      <div class="tc-name"><span>{{ t('theme.names.' + id) }}</span><span class="ok">{{ icon('check') }}</span></div></button>{% endfor %}</div>
  <div class="card block"><div class="fx-row"><div><b>{{ t('theme.fx') }}</b><p>{{ t('theme.fxHint') }}</p></div><label class="sw"><input type="checkbox" id="fxsw"><i></i></label></div></div>
</div>
